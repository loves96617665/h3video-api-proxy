name = "h3video-api-proxy"
account_id = ""
compatibility_date = "2026-09-23"
main = "src/index.js"
workers_dev = true

[vars]
API_BASE = "https://h3video.haizhuapi.bond"

[triggers]
crons = []

[env.production]
name = "h3video-api-proxy"
workers_dev = false
route = ""
zone_id = ""

[env.staging]
name = "h3video-api-proxy-staging"
workers_dev = true

# ============================================
# 部署步驟：
# 1. 登入 Cloudflare
#    npx wrangler login
#
# 2. 設定 account_id
#    編輯此檔案的 account_id 欄位
#    或設定環境變數: CLOUDFLARE_ACCOUNT_ID
#
# 3. 部署
#    npx wrangler deploy
#
# 4. 或使用 API token
#    npx wrangler deploy --api-token YOUR_TOKEN
# ============================================